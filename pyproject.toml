[project]
name = "integration_hass_oec-tariff"
version = "0.1.0"
description = "Home Assistant integration for OEC Tariff Data Service"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==0.25.0",
    "pytest-homeassistant-custom-component==0.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
